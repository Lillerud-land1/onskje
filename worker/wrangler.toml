# Cloudflare Worker for Ønskje (sjå worker.js).
name = "onskje"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

# Ingen logging av førespurnader (dei inneheld IP-adresser)
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "onskje"
database_id = "c6e29c74-9792-485c-a39d-04c4040bfba5"

# Kvar eining (IP) / konto: 20 forsøk i minuttet på innlogging, nye kontoar, reservasjonar og lenkjehenting
[[ratelimits]]
name = "GRENSE"
namespace_id = "4630"

  [ratelimits.simple]
  limit = 20
  period = 60
